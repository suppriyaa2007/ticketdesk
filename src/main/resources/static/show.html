<!DOCTYPE html>
<html>
<head>
    <title>Movie Shows</title>
    <style>
        body{font-family:Arial;background:#eef2ff;padding:30px;}
        .container{width:450px;margin:auto;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px gray;}
        input,button{width:100%;padding:10px;margin-top:10px;box-sizing:border-box;}
        button{background:#16a34a;color:white;border:none;border-radius:5px;cursor:pointer;}
        li{margin:10px 0;}
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 Movie Show Management</h2>

    <input type="text" id="title" placeholder="Movie Title">
    <input type="text" id="showTime" placeholder="Show Time">
    <input type="number" id="totalSeats" placeholder="Total Seats">

    <button onclick="addShow()">Add Show</button>

    <h3>Available Shows</h3>
    <ul id="showList"></ul>

    <button onclick="window.location='index.html'">⬅ Home</button>
</div>

<script>
    const API="http://localhost:8081/shows";

    window.onload=loadShows;

    function addShow(){
        const show={
            title:document.getElementById("title").value,
            showTime:document.getElementById("showTime").value,
            totalSeats:Number(document.getElementById("totalSeats").value),
            availableSeats:Number(document.getElementById("totalSeats").value)
        };

        fetch(API,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(show)
        })
            .then(res=>res.json())
            .then(()=>{
                alert("Show Added Successfully");
                loadShows();
            });
    }

    function loadShows(){
        fetch(API)
            .then(res=>res.json())
            .then(data=>{
                let list=document.getElementById("showList");
                list.innerHTML="";
                data.forEach(show=>{
                    list.innerHTML += `<li><b>${show.title}</b> - ${show.showTime} | Seats: ${show.availableSeats}/${show.totalSeats}</li>`;
                });
            });
    }
</script>

</body>
</html>
