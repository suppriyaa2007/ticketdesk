<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f3f4f6;
            margin:0;
            padding:30px;
        }

        .container{
            width:420px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#2563eb;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:15px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }

        h3{
            margin-top:25px;
            color:#1e3a8a;
        }

        ul{
            padding-left:20px;
        }

        li{
            margin:8px 0;
        }

        .home{
            background:#16a34a;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🎓 Student Registration</h2>

    <input type="text" id="name" placeholder="Enter Student Name">

    <input type="email" id="email" placeholder="Enter Student Email">

    <button onclick="saveStudent()">Register Student</button>

    <h3>Registered Students</h3>

    <ul id="studentList"></ul>

    <button class="home" onclick="window.location='index.html'">
        ⬅ Back to Home
    </button>

</div>

<script>

    const API = "http://localhost:8081/students";

    // Page open aagumbodhu students load aagum
    window.onload = function () {
        loadStudents();
    };

    // Student save
    function saveStudent(){

        const student = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value
        };

        fetch(API,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(student)
        })
            .then(response=>response.json())
            .then(data=>{

                alert("Student Registered Successfully ✅");

                document.getElementById("name").value="";
                document.getElementById("email").value="";

                loadStudents();

            })
            .catch(error=>{
                alert("Error while saving student");
                console.log(error);
            });

    }

    // Student list display
    function loadStudents(){

        fetch(API)
            .then(response=>response.json())
            .then(data=>{

                const list=document.getElementById("studentList");
                list.innerHTML="";

                data.forEach(student=>{

                    list.innerHTML +=
                        `<li>
                <b>ID:</b> ${student.studentId} <br>
                <b>Name:</b> ${student.name} <br>
                <b>Email:</b> ${student.email}
            </li><hr>`;

                });

            });

    }

</script>

</body>
</html>
